<!doctype html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการข้อมูลผู้สอน - บทเรียนออนไลน์เมืองสงขลา</title>

    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <!-- นำเข้าไลบรารี SheetJS สำหรับสร้างไฟล์ Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans Thai', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="h-full bg-slate-50 flex flex-col overflow-hidden text-slate-800">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md shrink-0">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur-sm border border-white/30">
                    <i data-lucide="layout-dashboard" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">ระบบจัดการข้อมูลผู้สอน</h1>
                    <p class="text-indigo-200 text-xs font-medium">บทเรียนออนไลน์ประวัติศาสตร์เมืองสงขลา</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <div class="relative flex-grow sm:flex-grow-0 min-w-[200px]">
                    <select id="classFilter" onchange="filterData()" class="w-full appearance-none bg-indigo-700/50 border border-indigo-500 text-white text-sm font-semibold rounded-lg px-4 py-2.5 outline-none focus:ring-2 focus:ring-white/50 transition cursor-pointer">
                        <option value="all">ดูทุกห้องเรียน</option>
                        <!-- ตัวเลือกห้องจะถูกเติมอัตโนมัติผ่าน JS -->
                    </select>
                    <i data-lucide="chevron-down" class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-indigo-300"></i>
                </div>
                <button onclick="exportToExcel()" class="bg-emerald-500 hover:bg-emerald-400 text-white px-4 py-2.5 rounded-lg font-bold text-sm shadow-md transition flex items-center gap-2 shrink-0">
                    <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">ส่งออก Excel</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow p-4 md:p-6 overflow-hidden flex flex-col max-w-7xl mx-auto w-full gap-4">
        
        <!-- Stats Summary -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 shrink-0">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center shrink-0"><i data-lucide="users" class="w-6 h-6"></i></div>
                <div>
                    <p class="text-xs font-bold text-slate-500">จำนวนนักเรียน</p>
                    <p class="text-2xl font-black text-slate-800" id="statTotalStudents">0</p>
                </div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center shrink-0"><i data-lucide="landmark" class="w-6 h-6"></i></div>
                <div>
                    <p class="text-xs font-bold text-slate-500">เขาแดง (ผ่าน)</p>
                    <p class="text-2xl font-black text-slate-800" id="statKaodaeng">0</p>
                </div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center shrink-0"><i data-lucide="map-pin" class="w-6 h-6"></i></div>
                <div>
                    <p class="text-xs font-bold text-slate-500">แหลมสน (ผ่าน)</p>
                    <p class="text-2xl font-black text-slate-800" id="statLaemson">0</p>
                </div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center shrink-0"><i data-lucide="building-2" class="w-6 h-6"></i></div>
                <div>
                    <p class="text-xs font-bold text-slate-500">บ่อยาง (ผ่าน)</p>
                    <p class="text-2xl font-black text-slate-800" id="statBoyang">0</p>
                </div>
            </div>
        </div>

        <!-- Data Table -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex-grow flex flex-col overflow-hidden relative">
            <div id="loadingOverlay" class="absolute inset-0 bg-white/80 backdrop-blur-sm z-20 flex flex-col items-center justify-center">
                <i data-lucide="loader-2" class="w-10 h-10 text-indigo-600 animate-spin mb-3"></i>
                <p class="font-bold text-slate-600">กำลังดึงข้อมูลจากฐานข้อมูล...</p>
            </div>

            <div class="overflow-auto custom-scrollbar flex-grow">
                <table class="w-full text-sm text-left whitespace-nowrap" id="scoreTable">
                    <thead class="text-xs text-slate-600 uppercase bg-slate-100 sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th scope="col" class="px-4 py-4 rounded-tl-xl">รหัส</th>
                            <th scope="col" class="px-4 py-4">ชื่อ - นามสกุล</th>
                            <th scope="col" class="px-4 py-4">ห้อง</th>
                            <th scope="col" class="px-4 py-4 text-center border-l border-slate-200 bg-red-50 text-red-700">เขาแดง (เกม)</th>
                            <th scope="col" class="px-4 py-4 text-center bg-red-50 text-red-700">เขาแดง (สอบ)</th>
                            <th scope="col" class="px-4 py-4 text-center border-l border-slate-200 bg-amber-50 text-amber-700">แหลมสน (เกม)</th>
                            <th scope="col" class="px-4 py-4 text-center bg-amber-50 text-amber-700">แหลมสน (สอบ)</th>
                            <th scope="col" class="px-4 py-4 text-center border-l border-slate-200 bg-blue-50 text-blue-700">บ่อยาง (เกม)</th>
                            <th scope="col" class="px-4 py-4 text-center bg-blue-50 text-blue-700">บ่อยาง (สอบ)</th>
                            <th scope="col" class="px-4 py-4 text-center border-l border-slate-200 bg-indigo-50 text-indigo-700 rounded-tr-xl">คะแนนรวม</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100" id="tableBody">
                        <!-- Data Rows Injected Here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // ตั้งค่าการเชื่อมต่อ Supabase
        const SUPABASE_URL = "https://dontfzkzlwnbfptpmayv.supabase.co/rest/v1/student_scores";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvbnRmemt6bHduYmZwdHBtYXl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3Mjc2OTAsImV4cCI6MjEwNTMwMzY5MH0.ql-NEY_X9m4r_bbO7BebYhTVW9RJJLBhSkOnYXOlIYc";
        const headers = {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            "Content-Type": "application/json"
        };

        let rawData = [];

        window.onload = async function() {
            await fetchAllData();
        };

        function num(val) {
            const n = parseFloat(val);
            return isNaN(n) ? 0 : n;
        }

        async function fetchAllData() {
            try {
                // ดึงข้อมูลทั้งหมดจากตาราง เรียงตามห้องเรียนและรหัสนักเรียน
                const response = await fetch(`${SUPABASE_URL}?select=*&order=class_room.asc,student_id.asc`, {
                    method: 'GET',
                    headers: headers
                });

                if (!response.ok) throw new Error("Failed to fetch data");
                
                rawData = await response.json();
                
                populateClassFilter();
                renderTable(rawData);
                
                document.getElementById('loadingOverlay').classList.add('hidden');
            } catch (error) {
                console.error(error);
                alert('เกิดข้อผิดพลาดในการโหลดข้อมูล กรุณารีเฟรชหน้าเว็บ');
            }
        }

        function populateClassFilter() {
            const filter = document.getElementById('classFilter');
            const classes = [...new Set(rawData.map(item => item.class_room))].filter(Boolean).sort();
            
            classes.forEach(cls => {
                const opt = document.createElement('option');
                opt.value = cls;
                opt.textContent = `ห้อง ${cls}`;
                filter.appendChild(opt);
            });
        }

        function filterData() {
            const selectedClass = document.getElementById('classFilter').value;
            if (selectedClass === 'all') {
                renderTable(rawData);
            } else {
                const filtered = rawData.filter(item => item.class_room === selectedClass);
                renderTable(filtered);
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            let passK = 0, passL = 0, passB = 0;

            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="px-4 py-8 text-center text-slate-500 font-bold">ไม่พบข้อมูล</td></tr>`;
                updateStats(0, 0, 0, 0);
                return;
            }

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors";
                
                const gk = num(item.game_khao_daeng_max); const qk = num(item.quiz_khao_daeng_max);
                const gl = num(item.game_laem_son_max); const ql = num(item.quiz_laem_son_max);
                const gb = num(item.game_bo_yang_max); const qb = num(item.quiz_bo_yang_max);
                const total = gk + qk + gl + ql + gb + qb;

                // นับจำนวนคนที่ผ่านด่าน (มีคะแนนเกม > 0 และสอบผ่านเกณฑ์ >= 5)
                if(gk > 0 || qk >= 5) passK++;
                if(gl > 0 || ql >= 5) passL++;
                if(gb > 0 || qb >= 5) passB++;

                tr.innerHTML = `
                    <td class="px-4 py-3 font-mono font-bold text-slate-600">${item.student_id || '-'}</td>
                    <td class="px-4 py-3 font-bold text-slate-800">${item.name || '-'}</td>
                    <td class="px-4 py-3 text-slate-600 font-semibold">${item.class_room || '-'}</td>
                    
                    <td class="px-4 py-3 text-center border-l border-slate-100 font-bold text-red-600">${gk || '-'}</td>
                    <td class="px-4 py-3 text-center font-bold text-red-600">${qk || '-'}</td>
                    
                    <td class="px-4 py-3 text-center border-l border-slate-100 font-bold text-amber-600">${gl || '-'}</td>
                    <td class="px-4 py-3 text-center font-bold text-amber-600">${ql || '-'}</td>
                    
                    <td class="px-4 py-3 text-center border-l border-slate-100 font-bold text-blue-600">${gb || '-'}</td>
                    <td class="px-4 py-3 text-center font-bold text-blue-600">${qb || '-'}</td>
                    
                    <td class="px-4 py-3 text-center border-l border-slate-100 font-black text-indigo-600 text-base">${total}</td>
                `;
                tbody.appendChild(tr);
            });

            updateStats(data.length, passK, passL, passB);
        }

        function updateStats(total, k, l, b) {
            document.getElementById('statTotalStudents').textContent = total;
            document.getElementById('statKaodaeng').textContent = k;
            document.getElementById('statLaemson').textContent = l;
            document.getElementById('statBoyang').textContent = b;
        }

        // ฟังก์ชันสำหรับดาวน์โหลดตารางเป็นไฟล์ Excel (.xlsx)
        function exportToExcel() {
            const selectedClass = document.getElementById('classFilter').value;
            const dataToExport = selectedClass === 'all' ? rawData : rawData.filter(item => item.class_room === selectedClass);
            
            if(dataToExport.length === 0) {
                alert("ไม่มีข้อมูลสำหรับส่งออก");
                return;
            }

            // จัดรูปแบบ Data ให้สวยงามก่อนสร้างไฟล์
            const excelData = dataToExport.map((item, index) => {
                const gk = num(item.game_khao_daeng_max); const qk = num(item.quiz_khao_daeng_max);
                const gl = num(item.game_laem_son_max); const ql = num(item.quiz_laem_son_max);
                const gb = num(item.game_bo_yang_max); const qb = num(item.quiz_bo_yang_max);
                
                return {
                    "ลำดับ": index + 1,
                    "รหัสนักเรียน": item.student_id || '',
                    "ชื่อ - นามสกุล": item.name || '',
                    "ห้องเรียน": item.class_room || '',
                    "เขาแดง (เกม)": gk,
                    "เขาแดง (สอบ)": qk,
                    "แหลมสน (เกม)": gl,
                    "แหลมสน (สอบ)": ql,
                    "บ่อยาง (เกม)": gb,
                    "บ่อยาง (สอบ)": qb,
                    "คะแนนรวม": gk + qk + gl + ql + gb + qb,
                    "อัปเดตล่าสุด": item.updated_at ? new Date(item.updated_at).toLocaleString('th-TH') : ''
                };
            });

            // สร้าง Workbook
            const worksheet = XLSX.utils.json_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "คะแนนนักเรียน");

            // ตั้งชื่อไฟล์ตามเวลาที่ส่งออก
            const dateStr = new Date().toISOString().split('T')[0];
            const classNameTag = selectedClass === 'all' ? 'ทุกห้อง' : `ห้อง_${selectedClass.replace('/','_')}`;
            const fileName = `คะแนนประวัติศาสตร์สงขลา_${classNameTag}_${dateStr}.xlsx`;

            // เขียนไฟล์และสั่งดาวน์โหลด
            XLSX.writeFile(workbook, fileName);
        }
    </script>
</body>
</html>
